name: DBT CI/CD Pipeline

on:
  push:
    branches:
      - dev-branch
  pull_request:
    branches:
      - dev-branch

jobs:
  dbt:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Set up Python
        uses: actions/setup-python@v2
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: |
          #pip install -r requirements.txt  # Install any Python dependencies
          pip install dbt-snowflake  # Install DBT for Snowflake

      - name: Install DBT packages
        run: |
          dbt deps  # Install any dependencies listed in packages.yml

      - name: Set up Snowflake credentials
        run: |
          # Create the .dbt directory and the profiles.yml file
          mkdir -p ~/.dbt
          
          # Write the DBT profile configuration with Snowflake credentials
          echo "
          data_pipeline:
            target: dev
            outputs:
              dev:
                type: snowflake
                account: snowflake_account
                user: snowflake_user
                password: snowflake_password
                role: snowflake_role
                database: snowflake_database
                warehouse: snowflake_warehouse
                schema: snowflake_schema
                threads: 1
                client_session_keep_alive: False
          " > ~/.dbt/profiles.yml  # Write the profiles.yml to the expected directory

      - name: Run DBT commands
        run: |
          dbt run  # Run your DBT models
          dbt snapshot #Running the snapshots
          dbt test  # Run DBT tests (optional but recommended)
