name: DBT CI/CD Pipeline

on:
  push:
    branches:
      - dev-branch
  pull_request:
    branches:
      - dev-branch

jobs:
  dbt:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4  # Updated to v4

      - name: Set up Python
        uses: snowflakedb/snowflake-connector-python-action@v1
        with:
          python-version: '3.8'
      
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libffi-dev \
            openssl \
            libssl-dev \
            gcc \
            python3-dev
          
      - name: Install cryptographic packages
        run: |
          pip install --upgrade \
            pyopenssl==22.1.0 \
            cffi==1.15.1
          pip uninstall -y cryptography
          pip install --no-binary cryptography cryptography==38.0.4

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install dbt-snowflake==1.3.0

      - name: Install DBT packages
        run: |
          dbt deps

      - name: Set up Snowflake credentials
        run: |
          mkdir -p ~/.dbt
          cat > ~/.dbt/profiles.yml <<EOF
          data_pipeline:
            target: dev
            outputs:
              dev:
                type: snowflake
                account: "${{ secrets.LENS_SNOWFLAKE_ACCOUNT }}"
                user: "${{ secrets.LENS_SNOWFLAKE_USER }}"
                password: "${{ secrets.LENS_SNOWFLAKE_PASSWORD }}"
                role: "${{ secrets.LENS_SNOWFLAKE_ROLE }}"
                database: "${{ secrets.LENS_SNOWFLAKE_DATABASE }}"
                warehouse: "${{ secrets.LENS_SNOWFLAKE_WAREHOUSE }}"
                schema: "${{ secrets.LENS_SNOWFLAKE_SCHEMA }}"
                threads: 4
                client_session_keep_alive: false
          EOF

      - name: Debug Configuration
        run: |
          echo "=== profiles.yml content ==="
          cat ~/.dbt/profiles.yml
          echo "=== Secrets Verification ==="
          echo "Account: ${{ secrets.LENS_SNOWFLAKE_ACCOUNT != '' }}"
          echo "User: ${{ secrets.LENS_SNOWFLAKE_USER != '' }}"
          echo "Password: ${{ secrets.LENS_SNOWFLAKE_PASSWORD != '' }}"

      - name: Verify connection
        run: |
          dbt debug --target dev

      - name: Run DBT commands
        run: |
          dbt run --target dev
          dbt snapshot --target dev
          dbt test --target dev