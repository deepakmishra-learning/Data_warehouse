name: DBT CI/CD Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  dbt:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Set up Python
        uses: actions/setup-python@v2
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: |
          #pip install -r requirements.txt  # Install any Python dependencies
          pip install dbt-snowflake  # Install DBT for Snowflake

      - name: Set up Snowflake credentials
        run: |
          # Create the .dbt directory and the profiles.yml file
          mkdir -p ~/.dbt
          
          # Write the DBT profile configuration with Snowflake credentials
          echo "
          default:
            target: dev
            outputs:
              dev:
                type: snowflake
                account: your_snowflake_account
                user: your_snowflake_user
                password: your_snowflake_password
                role: your_snowflake_role
                database: your_snowflake_database
                warehouse: your_snowflake_warehouse
                schema: your_snowflake_schema
                threads: 1
                client_session_keep_alive: False
          " > ~/.dbt/profiles.yml  # Write the profiles.yml to the expected directory

      - name: Run DBT commands
        run: |
          dbt run  # Run your DBT models
          dbt test  # Run DBT tests (optional but recommended)
